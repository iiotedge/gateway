name: packages-probe

# Temporary: checks whether this repository's GITHUB_TOKEN can read the
# Maven packages published by iiotedge/platform-build and iiotedge/common,
# and lists the published versions. Removed again before review.

on:
  push:
    branches: [ci/standard-pipeline]

permissions: {}

jobs:
  packages-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Probe GitHub Packages (packages read)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=https://maven.pkg.github.com/iiotedge
          probe() {
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' -u "${GITHUB_ACTOR}:${TOKEN}" "$1")
            versions=""
            if [ "$code" = 200 ]; then
              versions=$(grep -oE '<version>[^<]+</version>' "$RUNNER_TEMP/body" | sed -E 's#</?version>##g' | sort -u | tr '\n' ' ')
            fi
            echo "$code ${1#"$B"} ${versions}"
          }
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/maven-metadata.xml"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-bom/maven-metadata.xml"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18-SNAPSHOT/maven-metadata.xml"
          probe "$B/common/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          probe "$B/gateway/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          for a in data base interfaces utils proto message transport; do
            probe "$B/common/com/iotmining/common/$a/maven-metadata.xml"
          done
          probe "$B/common/com/iiotedge/iiotedge-audit-starter/maven-metadata.xml"
          probe "$B/common/com/iiotedge/iiotedge-security-starter/maven-metadata.xml"
          echo "anonymous: $(curl -s -o /dev/null -w '%{http_code}' "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom")"
          echo "REST package list:"
          curl -s -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/iiotedge/packages?package_type=maven&per_page=100" \
            | jq -r 'if type == "array" then .[] | select(.repository.name == "platform-build" or .repository.name == "common") | "\(.name) repo=\(.repository.name)" else "error: \(.message)" end'

  no-packages-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Probe GitHub Packages (no packages permission)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=https://maven.pkg.github.com/iiotedge
          probe() {
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' -u "${GITHUB_ACTOR}:${TOKEN}" "$1")
            versions=""
            if [ "$code" = 200 ]; then
              versions=$(grep -oE '<version>[^<]+</version>' "$RUNNER_TEMP/body" | sed -E 's#</?version>##g' | sort -u | tr '\n' ' ')
            fi
            echo "$code ${1#"$B"} ${versions}"
          }
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/maven-metadata.xml"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-bom/maven-metadata.xml"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          probe "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18-SNAPSHOT/maven-metadata.xml"
          probe "$B/common/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          probe "$B/gateway/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom"
          for a in data base interfaces utils proto message transport; do
            probe "$B/common/com/iotmining/common/$a/maven-metadata.xml"
          done
          probe "$B/common/com/iiotedge/iiotedge-audit-starter/maven-metadata.xml"
          probe "$B/common/com/iiotedge/iiotedge-security-starter/maven-metadata.xml"
          echo "anonymous: $(curl -s -o /dev/null -w '%{http_code}' "$B/platform-build/com/iiotedge/build/iiotedge-parent/2025.08.18/iiotedge-parent-2025.08.18.pom")"
          echo "REST package list:"
          curl -s -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/iiotedge/packages?package_type=maven&per_page=100" \
            | jq -r 'if type == "array" then .[] | select(.repository.name == "platform-build" or .repository.name == "common") | "\(.name) repo=\(.repository.name)" else "error: \(.message)" end'
